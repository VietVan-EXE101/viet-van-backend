<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Việt Văn • Kịch tương tác</title>
<style>
:root{color-scheme:dark;--bg:#080f1d;--panel:#151f31;--text:#f6f5ef;--muted:#a7b5cb;--a:#e4c78b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#1d3040,#080f1d 64%);font:15px/1.55 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text)}.container{width:min(1280px,94vw);margin:0 auto;padding:26px 0 45px}.header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:21px}.brand{font-weight:850;letter-spacing:-.4px;font-size:24px}.brand span{color:var(--a)}.tag{letter-spacing:2px;font-size:10px;color:var(--a);font-weight:800}.header select,button{font:inherit;background:#1d2b41;border:1px solid #40516a;color:var(--text);border-radius:9px;padding:9px 15px;cursor:pointer}.header select{max-width:300px}.intro{text-align:center;margin-bottom:25px}.intro h1{font-size:clamp(25px,4vw,38px);line-height:1.15;margin:7px 0}.muted{color:var(--muted)}.stage{width:100%;aspect-ratio:16/9;border-radius:17px;position:relative;overflow:hidden;background:#101724;box-shadow:0 18px 55px #0008;border:1px solid #384354}.stage>img{width:100%;height:100%;object-fit:contain;display:block}.stage video{width:100%;height:100%;object-fit:contain}.stage .empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted)}.spot{position:absolute;background:transparent;border:2px solid transparent;border-radius:9px;cursor:pointer;padding:0;overflow:visible;z-index:2}.spot:hover,.spot:focus-visible{border:2px solid #ffe0a0;background:#f5c8731a;outline:none}.spot img{position:absolute;width:100%;height:100%;object-fit:contain;left:0;top:0;pointer-events:none}.spot .plus{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#15253bd9;border:2px solid #f9da9a;border-radius:100%;width:36px;height:36px;display:grid;place-items:center;color:#f9e6c0;font-size:22px;box-shadow:0 4px 20px #000b}.spot:hover .plus{background:#e4c78b;color:#1b2434}.controls{display:grid;grid-template-columns:auto 1fr auto;gap:15px;align-items:center;margin:18px auto;max-width:920px}button:hover{border-color:#e4c78b}audio{width:100%;height:44px}.info{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;color:var(--muted);font-size:13px}.hint{font-size:13px;color:var(--muted);text-align:center;margin-top:10px}.overlay{position:fixed;inset:0;background:#030915bb;display:grid;place-items:center;padding:16px;z-index:100}.overlay[hidden]{display:none}.modal{background:#142238;border:1px solid #657182;border-radius:19px;padding:28px;width:min(530px,96vw);box-shadow:0 25px 80px #000b}.modal h2{font-size:27px;margin:4px 0}.modal .en{color:#e4c78b;font-size:16px}.modal .line{height:1px;background:#3c4a5d;margin:18px 0}.modal p{white-space:pre-wrap}.modal .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}.modal button.primary{background:#e4c78b;color:#1d2435;font-weight:800}.selection{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin-top:14px}.selection button{font-size:12px;padding:6px 11px}.selection button.selected{background:#c4ad7a;color:#171e29}@media(max-width:640px){.header{align-items:flex-start;flex-direction:column}.controls{grid-template-columns:1fr 1fr}.controls audio{grid-column:1/-1;grid-row:1}.container{width:97vw}.stage{border-radius:7px}.spot .plus{width:25px;height:25px;font-size:15px}.modal{padding:20px}}
</style></head><body>
<div class="container"><header class="header"><div><div class="tag">VIỆT VĂN • INTERACTIVE STAGE</div><div class="brand">Việt <span>Văn</span></div></div><div><a style="color:#e4c78b;margin-right:15px" href="/vip.html">Đăng nhập / VIP</a><select id="dramas" aria-label="Chọn vở kịch"></select></div></header>
<div class="intro"><div class="tag">KHÁM PHÁ VĂN HỌC</div><h1 id="title">Kịch tương tác</h1><div class="muted" id="desc">Chạm vào nhân vật, đồ vật để khám phá câu chuyện.</div></div>
<div class="stage" id="stage"><div class="empty">Đang tải kịch...</div></div>
<div class="selection" id="scenes"></div><div class="controls"><button id="prev">← Cảnh trước</button><audio id="audio" controls preload="metadata"></audio><button id="next">Cảnh sau →</button></div>
<div class="info"><span id="sceneInfo"></span><span>·</span><span id="timeInfo"></span></div><p class="hint">Nhấn vào dấu + trên sân khấu để mở thông tin nhân vật hoặc đồ vật bằng tiếng Việt và tiếng Anh. Audio tạm dừng khi mở popup.</p>
<p id="error" style="text-align:center;color:#ffd9a4"></p><section id="reviews" aria-live="polite"></section></div>
<div class="overlay" id="overlay" hidden role="dialog" aria-modal="true" aria-labelledby="modalTitle"><article class="modal"><div class="tag" id="modalKind">KHÁM PHÁ</div><h2 id="modalTitle"></h2><div class="en" id="modalEn"></div><div class="line"></div><div id="modalVi"></div><div class="line"></div><div class="muted" id="modalMeaningEn"></div><div class="foot" id="modalActions"><button id="close" class="primary">Đóng</button></div></article></div>
<script src="/reviews.js"></script><script>
'use strict';
const $=id=>document.getElementById(id);let drama=null,scene=null,index=0,lastTime=0;const token=sessionStorage.getItem('vv_token')||'';const mediaCache=new Map();
async function mediaUrl(asset){if(!asset)return '';if(!token)return asset.url;if(mediaCache.has(asset.id))return mediaCache.get(asset.id);const response=await fetch(asset.url,{headers:{Authorization:'Bearer '+token},cache:'no-store'});if(!response.ok)throw Error('Không có quyền tải media ('+response.status+'). Hãy đăng nhập/mua VIP.');const blob=URL.createObjectURL(await response.blob());mediaCache.set(asset.id,blob);return blob}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function get(path){const r=await fetch(path,{headers:token?{Authorization:'Bearer '+token}:{}});if(!r.ok){const data=await r.json().catch(()=>({}));if(data.code==='CULTURAL_INSIGHT_LIMIT_REACHED'){if(confirm('Bạn đã hết lượt khám phá. Xem gói Pro?'))location.href='/vip.html';throw Error(data.message)}throw Error(r.status===401||r.status===403?'Bạn cần đăng nhập hoặc có gói VIP để xem nội dung này. Mở trang VIP để nâng cấp.':`Không tải được dữ liệu (${r.status}). Kiểm tra SQL scripts.`)}return r.json()}
async function init(){try{const items=await get('/api/dramas');$('dramas').innerHTML=items.map(x=>`<option value="${x.id}">${esc(x.title)}</option>`).join('');if(!items.length){$('stage').innerHTML='<div class="empty">Chưa có vở kịch đã xuất bản. Hãy tạo trong Drama Studio.</div>';return}const requested=new URLSearchParams(location.search).get('id');const id=items.some(x=>String(x.id)===requested)?requested:items[0].id;$('dramas').value=id;await loadDrama(id)}catch(e){$('error').textContent=e.message}}
async function loadDrama(id){try{drama=await get(`/api/dramas/${id}`);$('title').textContent=drama.title;$('desc').textContent=drama.description||'Khám phá những câu chuyện Việt Nam qua sân khấu tương tác.';window.mountReviews($('reviews'),'dramas',drama.id,token);if(!drama.scenes.length){$('stage').innerHTML='<div class="empty">Kịch chưa có cảnh.</div>';return}selectScene(0)}catch(e){$('error').textContent=e.message}}
async function selectScene(i,autoplay=false){if(!drama?.scenes[i])return;index=i;scene=drama.scenes[i];const stage=$('stage');const current=scene;
 try{const bg=await mediaUrl(current.video||current.background);if(scene!==current)return;stage.innerHTML=current.video?`<video src="${esc(bg)}" controls></video>`:current.background?`<img src="${esc(bg)}" alt="${esc(current.title)}">`:'<div class="empty">Chưa có ảnh nền</div>';renderSpots();
 $('sceneInfo').textContent=`Cảnh ${i+1}/${drama.scenes.length}: ${current.title}`;$('prev').disabled=i===0;$('next').disabled=i===drama.scenes.length-1;
 $('scenes').innerHTML=drama.scenes.map((s,j)=>`<button class="${i===j?'selected':''}" data-i="${j}">${esc(s.title)}</button>`).join('');$('scenes').querySelectorAll('button').forEach(b=>b.onclick=()=>selectScene(Number(b.dataset.i)));
 const audio=$('audio');const nextUrl=await mediaUrl(current.audio);if(scene!==current)return;audio.pause();audio.onloadedmetadata=null;if(!nextUrl){audio.removeAttribute('src');audio.load();return}const seek=()=>{audio.currentTime=Math.min(current.audioOffsetMs/1000,audio.duration||0);if(autoplay)audio.play().catch(()=>{})};if(audio.getAttribute('src')!==nextUrl){audio.src=nextUrl;audio.onloadedmetadata=seek;audio.load()}else seek();$('timeInfo').textContent=`${Math.round(current.startMs/1000)}s – ${Math.round(current.endMs/1000)}s`}
 catch(e){$('error').textContent=e.message}
}
function renderSpots(){if(!scene)return;const stage=$('stage');stage.querySelectorAll('.spot').forEach(x=>x.remove());const audio=$('audio');const elapsed=audio.src&&Number.isFinite(audio.currentTime)?Math.max(0,Math.round((audio.currentTime*1000)-scene.audioOffsetMs)):0;
 for(const s of scene.hotspots.filter(s=>s.isEnabled&&(s.startMs===null||elapsed>=s.startMs)&&(s.endMs===null||elapsed<=s.endMs))){const b=document.createElement('button');b.className='spot';b.style.left=s.x+'%';b.style.top=s.y+'%';b.style.width=s.width+'%';b.style.height=s.height+'%';b.style.zIndex=10+s.zIndex;b.title=s.nameVi;b.setAttribute('aria-label',`Tìm hiểu ${s.nameVi}`);if(s.visualAsset){const img=document.createElement('img');mediaUrl(s.visualAsset).then(url=>{if(img.isConnected)img.src=url}).catch(e=>{$('error').textContent=e.message});img.alt='';b.appendChild(img)}const marker=document.createElement('span');marker.className='plus';marker.textContent='+';b.appendChild(marker);b.onclick=()=>openSpot(s.id);stage.appendChild(b)}}
async function updateInsightUsage(){if(!token||!drama)return;try{const u=await get(`/api/dramas/${drama.id}/insights/usage`);$('modalKind').textContent+=u.remaining===null?' · Không giới hạn':` · Còn ${u.remaining}/${u.limit} lượt`}catch{}}
async function openSpot(id){try{const h=await get(`/api/dramas/${drama.id}/hotspots/${id}`);$('audio').pause();$('modalKind').textContent=h.kind==='Character'?'NHÂN VẬT':'ĐỒ VẬT / SỰ VẬT';$('modalTitle').textContent=h.nameVi;$('modalEn').textContent=h.nameEn||'';$('modalVi').textContent=h.meaningVi;$('modalMeaningEn').textContent=h.meaningEn||'';const actions=$('modalActions');actions.querySelectorAll('[data-target]').forEach(b=>b.remove());for(const targetId of h.targetSegmentIds||[]){const targetIndex=drama.scenes.findIndex(s=>s.id===targetId);if(targetIndex<0)continue;const b=document.createElement('button');b.textContent=`Đến: ${drama.scenes[targetIndex].title}`;b.dataset.target=targetIndex;b.onclick=()=>{hideModal();selectScene(targetIndex)};actions.prepend(b)}$('overlay').hidden=false;$('close').focus();updateInsightUsage()}catch(e){$('error').textContent=e.message}}
function hideModal(){$('overlay').hidden=true}
$('close').onclick=hideModal;$('overlay').onclick=e=>{if(e.target===$('overlay'))hideModal()};document.onkeydown=e=>{if(e.key==='Escape')hideModal()};$('dramas').onchange=e=>loadDrama(e.target.value);$('prev').onclick=()=>selectScene(index-1);$('next').onclick=()=>selectScene(index+1);
$('audio').ontimeupdate=()=>{if(!scene)return;const elapsed=Math.max(0,$('audio').currentTime*1000-scene.audioOffsetMs);$('timeInfo').textContent=`Đã phát ${Math.round(elapsed/1000)}s / ${Math.round((scene.endMs-scene.startMs)/1000)}s`;if(Math.abs(elapsed-lastTime)>280){lastTime=elapsed;renderSpots()}if(elapsed>=scene.endMs-scene.startMs){$('audio').pause();if(index<drama.scenes.length-1)selectScene(index+1,true)}};
init();
</script></body></html>
